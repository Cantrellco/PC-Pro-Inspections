    </linearGradient>
  </defs>
  <!-- CHROME -->
  <circle cx="36" cy="36" r="34.4" fill="#5a4310"/>
  <circle cx="36" cy="36" r="33.6" fill="url(#ti-bezel)"/>
  <circle cx="36" cy="35.3" r="33.6" fill="url(#ti-sheen)" opacity="0.9"/>
  <circle cx="36" cy="36" r="28.2" fill="url(#ti-face)"/>
