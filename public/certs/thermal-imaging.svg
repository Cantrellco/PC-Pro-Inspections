<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" role="img" aria-label="Thermal imaging certification seal">
  <defs>
    <linearGradient id="ti-bezel" x1="20" y1="3" x2="52" y2="69" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f7e7ad"/>
      <stop offset="0.34" stop-color="#cda531"/>
      <stop offset="0.72" stop-color="#8c6712"/>
      <stop offset="1" stop-color="#6b4e0d"/>
    </linearGradient>
    <linearGradient id="ti-sheen" x1="0" y1="3" x2="0" y2="24" gradientUnits="userSpaceOnUse">
