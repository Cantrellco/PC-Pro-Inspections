<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" role="img" aria-label="Termite / wood-destroying organism certification seal">
  <defs>
    <radialGradient id="tm-face" cx="50%" cy="35%" r="72%">
      <stop offset="0" stop-color="#123f6c"/>
      <stop offset="0.7" stop-color="#0a2647"/>
      <stop offset="1" stop-color="#04162c"/>
    </radialGradient>
    <linearGradient id="tm-brass" x1="0" y1="6" x2="0" y2="66" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f4e1a0"/>
      <stop offset="0.5" stop-color="#cda531"/>
      <stop offset="1" stop-color="#9a7414"/>
    </linearGradient>
  </defs>
  <circle cx="36" cy="36" r="33.5" fill="url(#tm-face)" stroke="url(#tm-brass)" stroke-width="2.6"/>
  <circle cx="36" cy="36" r="28.5" fill="none" stroke="url(#tm-brass)" stroke-width="0.9" opacity="0.55"/>
  <g transform="translate(0 3.8) translate(36 36) scale(.8) translate(-36 -36)">
    <!-- antennae -->
    <g fill="none" stroke="url(#tm-brass)" stroke-width="2" stroke-linecap="round">
      <path d="M34.5 18.5Q31 15 29 16"/><path d="M37.5 18.5Q41 15 43 16"/>
    </g>
    <!-- legs -->
    <g fill="none" stroke="url(#tm-brass)" stroke-width="2.2" stroke-linecap="round">
      <path d="M33 26Q28 24 25 21"/><path d="M32.5 29.5Q27 29.5 24 28.5"/><path d="M33 33Q28 35 25 37.5"/>
      <path d="M39 26Q44 24 47 21"/><path d="M39.5 29.5Q45 29.5 48 28.5"/><path d="M39 33Q44 35 47 37.5"/>
    </g>
    <!-- body -->
    <ellipse cx="36" cy="28" rx="3.4" ry="3.8" fill="url(#tm-brass)"/>
    <ellipse cx="36" cy="41" rx="5" ry="7.5" fill="url(#tm-brass)"/>
    <circle cx="36" cy="20" r="3" fill="#e23b53"/>
  </g>
</svg>
