<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" role="img" aria-label="Mold assessment certification seal">
  <defs>
    <radialGradient id="md-face" cx="50%" cy="35%" r="72%">
      <stop offset="0" stop-color="#123f6c"/>
      <stop offset="0.7" stop-color="#0a2647"/>
      <stop offset="1" stop-color="#04162c"/>
    </radialGradient>
    <linearGradient id="md-brass" x1="0" y1="6" x2="0" y2="66" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f4e1a0"/>
      <stop offset="0.5" stop-color="#cda531"/>
      <stop offset="1" stop-color="#9a7414"/>
    </linearGradient>
  </defs>
  <circle cx="36" cy="36" r="33.5" fill="url(#md-face)" stroke="url(#md-brass)" stroke-width="2.6"/>
  <circle cx="36" cy="36" r="28.5" fill="none" stroke="url(#md-brass)" stroke-width="0.9" opacity="0.55"/>
  <g transform="translate(36 36) scale(.8) translate(-36 -36)">
    <!-- droplet -->
    <path d="M36 16c7 9.5 12 15.5 12 22.5a12 12 0 0 1-24 0c0-7 5-13 12-22.5z" fill="none" stroke="url(#md-brass)" stroke-width="3" stroke-linejoin="round"/>
    <!-- check -->
    <path d="M30 38.5 34.5 43 43 34" fill="none" stroke="#e23b53" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
