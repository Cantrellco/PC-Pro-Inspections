<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="og-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c0c0e"/>
      <stop offset="55%" stop-color="#0a0a0b"/>
      <stop offset="100%" stop-color="#061a33"/>
    </linearGradient>
    <linearGradient id="og-shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e3a73"/>
      <stop offset="100%" stop-color="#061a33"/>
    </linearGradient>
    <radialGradient id="og-glow" cx="22%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#0e3a73" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0e3a73" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Heritage background -->
  <rect width="1200" height="630" fill="url(#og-bg)"/>
  <rect width="1200" height="630" fill="url(#og-glow)"/>

  <!-- Heritage rule band at top (crimson / bone / navy) -->
  <rect x="0" y="0" width="1200" height="8" fill="#c8102e"/>
  <rect x="0" y="8" width="1200" height="3" fill="#c9a227"/>

  <!-- Brass frame hairline -->
  <rect x="40" y="40" width="1120" height="550" rx="18" fill="none"
        stroke="#c9a227" stroke-opacity="0.45" stroke-width="2"/>

  <!-- Brand seal (mark) scaled up and centered on the left -->
  <g transform="translate(150, 195) scale(5)">
    <path d="M24 2.5 L42 8 V24 C42 35 33.5 42.5 24 45.5 C14.5 42.5 6 35 6 24 V8 Z"
          fill="url(#og-shield)" stroke="#c9a227" stroke-width="1.4"/>
    <path d="M24 6 L38.5 10.4 V24 C38.5 33 31.6 39.4 24 42.1 C16.4 39.4 9.5 33 9.5 24 V10.4 Z"
          fill="none" stroke="#c9a227" stroke-opacity="0.38" stroke-width="0.8"/>
    <path d="M31.5 16.8 A9.4 9.4 0 1 0 31.5 33.2" fill="none" stroke="#c9a227"
          stroke-width="2.4" stroke-linecap="round"/>
    <path d="M21 16.5 V34" fill="none" stroke="#f5f3ee" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M21 16.5 H26.4 A4.3 4.3 0 0 1 26.4 25.1 H21" fill="none" stroke="#f5f3ee"
          stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M16.5 16.5 L24 10.5 L31.5 16.5" fill="none" stroke="#e0c469"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M19.6 34 V30.4 H22.4 V34" fill="none" stroke="#c8102e" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M24 4.6 L24.85 6.9 L27.3 6.9 L25.3 8.4 L26.05 10.7 L24 9.3 L21.95 10.7 L22.7 8.4 L20.7 6.9 L23.15 6.9 Z"
          fill="#e0c469"/>
  </g>

  <!-- Wordmark + tagline -->
  <text x="500" y="270" font-family="Fraunces, Georgia, serif" font-size="86" font-weight="600"
        letter-spacing="-1.5">
    <tspan fill="#f5f3ee">PC Pro</tspan> <tspan fill="#e0c469">Inspections</tspan>
  </text>

  <text x="502" y="340" font-family="'Hanken Grotesk', system-ui, sans-serif" font-size="34" font-weight="500"
        fill="#c7c4bd">Honest, thorough home inspections —</text>
  <text x="502" y="384" font-family="'Hanken Grotesk', system-ui, sans-serif" font-size="34" font-weight="500"
        fill="#c7c4bd">so you buy with confidence.</text>

  <!-- Brass divider -->
  <rect x="502" y="424" width="120" height="3" rx="1.5" fill="#c9a227"/>

  <!-- Trust line -->
  <text x="502" y="476" font-family="'Hanken Grotesk', system-ui, sans-serif" font-size="22" font-weight="600"
        letter-spacing="3" fill="#e0c469">CERTIFIED · DETAILED · 24-HOUR REPORTS</text>
</svg>
